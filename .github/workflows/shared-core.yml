name: Shared core

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore shared solution
        run: dotnet restore atproto-dotnet.slnx

      - name: Build shared solution
        run: dotnet build atproto-dotnet.slnx --configuration Release --no-restore

      - name: Test shared solution
        run: dotnet test atproto-dotnet.slnx --configuration Release --no-build

      - name: Pack shared libraries and tools
        run: dotnet pack atproto-dotnet.slnx --configuration Release --no-restore --output artifacts/packages

      - name: Publish packages to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "$NUGET_AUTH_TOKEN"
          --skip-duplicate
